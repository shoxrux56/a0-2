<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rus raqamlari: 1 dan 5000 gacha</title>
<style>
:root{--bg:#fff;--tx:#3c3c3c;--mut:#777;--bd:#e5e5e5;--card:#fff;--g:#58cc02;--gd:#46a302;--b:#1cb0f6;--r:#ff4b4b;--y:#ffc800;--gl:#d7ffb8;--rl:#ffdfe0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131f24;--tx:#f1f7fb;--mut:#8ea0a8;--bd:#37464f;--card:#1f2c33;--gl:#1d3b14;--rl:#4a2024;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131f24;--tx:#f1f7fb;--mut:#8ea0a8;--bd:#37464f;--card:#1f2c33;--gl:#1d3b14;--rl:#4a2024;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 16px 120px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;font-weight:800;font-size:1.1rem}
.av{width:46px;height:46px;border-radius:50%;background:var(--gl);display:grid;place-items:center;font-size:1.7rem;border:3px solid var(--g)}
h1,h2{text-align:center;margin:10px 0}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0 30px}
.node{text-align:center;position:relative}
.nb{width:78px;height:78px;border-radius:50%;border:0;font-size:2rem;font-weight:800;color:#fff;cursor:pointer;background:var(--g);box-shadow:0 7px 0 var(--gd)}
.nb.done{background:var(--y);box-shadow:0 7px 0 #d9a900}
.nb.lock{background:var(--bd);box-shadow:0 7px 0 #bdbdbd;color:var(--mut)}
.nb.cur{animation:pl 1.4s infinite}
.nl{font-size:.85rem;color:var(--mut);margin-top:10px;font-weight:700}
.bub{position:absolute;left:92px;top:12px;white-space:nowrap;background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:6px 10px;font-weight:700;font-size:.9rem}
@keyframes pl{50%{transform:scale(1.08)}}
@keyframes hop{40%{transform:translateY(-14px)}}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}
.avb{font-size:2.6rem;padding:14px 0;border-radius:18px;border:2px solid var(--bd);border-bottom-width:5px;background:var(--card);cursor:pointer}
.tipb{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:14px;line-height:1.5;font-size:1.05rem;margin:10px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:14px 0}
.cd{border:2px solid var(--bd);border-bottom-width:5px;background:var(--card);color:var(--tx);border-radius:16px;padding:10px 6px;text-align:center;cursor:pointer;font:inherit}
.cd b{display:block;font-size:1.6rem;color:var(--b)}
.cd span{display:block;font-weight:700}
.cd small{color:var(--mut)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:16px;font-size:1.1rem;font-weight:800;color:#fff;background:var(--g);box-shadow:0 5px 0 var(--gd);cursor:pointer;text-transform:uppercase;letter-spacing:.5px}
.btn.s{background:var(--b);box-shadow:0 5px 0 #1899d6}
.qh{display:flex;align-items:center;gap:10px;padding:14px 0}
.x{border:0;background:none;color:var(--mut);font-size:1.5rem;cursor:pointer}
.pb{flex:1;height:14px;background:var(--bd);border-radius:8px;overflow:hidden}
.pb i{display:block;height:100%;width:0;background:var(--g);border-radius:8px;transition:width .3s}
.q{text-align:center;padding:14px 0}
.qs{font-weight:800;font-size:1.25rem;margin-bottom:16px}
.bign{font-size:6rem;font-weight:800;color:var(--b);line-height:1}
.bigw{font-size:2.2rem;font-weight:800;word-break:break-word}
.spk{font-size:3rem;border:0;background:var(--b);color:#fff;width:110px;height:110px;border-radius:50%;box-shadow:0 6px 0 #1899d6;cursor:pointer}
.spk.s{width:56px;height:56px;font-size:1.6rem;margin-top:10px}
.opts{display:grid;gap:12px;margin-top:10px}
.opt{border:2px solid var(--bd);border-bottom-width:5px;background:var(--card);color:var(--tx);border-radius:16px;padding:14px;font:inherit;cursor:pointer;text-align:center}
.opt b{font-size:1.4rem;display:block}.opt .dg{font-size:2rem}
.opt small{color:var(--mut);font-size:.95rem}
.opt.good{background:var(--gl);border-color:var(--g)}
.opt.bad{background:var(--rl);border-color:var(--r)}
.fb{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.fb:empty{display:none}
.fb.g{background:var(--gl)}.fb.r{background:var(--rl)}
.fb>div,.fb>button{max-width:480px;margin-left:auto;margin-right:auto}
.fbt{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.fav{font-size:2.4rem;display:inline-block}.hop{animation:hop .6s}.shk{animation:shk .4s}
.fb.r .btn{background:var(--r);box-shadow:0 5px 0 #d33}
.end{text-align:center;padding-top:40px}
.end .big{font-size:6rem}
.cr{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--bd);cursor:pointer}
.cn{font-size:1.8rem;font-weight:800;color:var(--b);min-width:74px}
.cw{flex:1;font-weight:700;font-size:1.1rem}.cw small{display:block;color:var(--mut);font-weight:400}
.ck{font-size:.75rem;font-weight:800;background:var(--gl);border-radius:8px;padding:4px 8px;text-align:center}
mark{background:var(--y);color:#222;border-radius:4px;padding:0 3px}
.warn{background:#fff3cd;color:#664d03;padding:8px 10px;border-radius:10px;font-size:.88rem;margin:8px 0}
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;min-height:80vh}
.splash .btn{max-width:320px}
.camel{width:190px;animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<div id="app"></div>

const W={0:["ноль","nol"],1:["один","adin"],2:["два","dva"],3:["три","tri"],4:["четыре","chetire"],5:["пять","pyat"],6:["шесть","shest"],7:["семь","sem"],8:["восемь","vosem"],9:["девять","devyat"],10:["десять","desyat"],11:["одиннадцать","adinnatsat"],12:["двенадцать","dvenatsat"],13:["тринадцать","trinatsat"],14:["четырнадцать","chetirnatsat"],15:["пятнадцать","pyatnatsat"],16:["шестнадцать","shestnatsat"],17:["семнадцать","semnatsat"],18:["восемнадцать","vosemnatsat"],19:["девятнадцать","devyatnatsat"],20:["двадцать","dvatsat"]};
const T={20:["двадцать","dvatsat"],30:["тридцать","tritsat"],40:["сорок","sorok"],50:["пятьдесят","pyatdesyat"],60:["шестьдесят","shestdesyat"],70:["семьдесят","semdesyat"],80:["восемьдесят","vosemdesyat"],90:["девяносто","devyanosta"]};
const H={1:["сто","sto"],2:["двести","dvesti"],3:["триста","trista"],4:["четыреста","chetirista"],5:["пятьсот","pyatsot"],6:["шестьсот","shestsot"],7:["семьсот","semsot"],8:["восемьсот","vosemsot"],9:["девятьсот","devyatsot"]};

function parts(n){if(n===0)return[W[0]];const p=[],k=Math.floor(n/1000),r=n%1000,h=Math.floor(r/100),m=r%100;if(k)p.push(K[k]);if(h)p.push(H[h]);if(m){if(m<=20)p.push(W[m]);else if(m%10===0)p.push(T[m]);else{p.push(T[m-m%10]);p.push(W[m%10])}}return p}
const ru=n=>parts(n).map(x=>x[0]).join(" "),uz=n=>parts(n).map(x=>x[1]).join(" ");

{t:"5 · 15 · 50",ic:"🎯",n:[5,15,50,4,14,40,6,16,60],show:[5,15,50,4,14,40],cmp:[5,15,50],tip:"Adashmang!<br><b>5</b> пять: qisqa.<br><b>15</b> пят<b>надцать</b>: oxirida «надцать».<br><b>50</b> пять<b>десят</b>: oxirida «десят»."},

{t:"Minglar",ic:"🚀",n:[1000,2000,3000,4000,5000,1500,2500],cmp:[5,500,5000],tip:"1000 <b>тысяча</b>, 2000–4000 <b>тысячи</b>, 5000 пять <b>тысяч</b>.<br>1500 = тысяча пятьсот."},
{t:"Final!",ic:"🏆",n:[5,15,50,500,5000,4,40,400,4000,3,30,300,3000],show:[5,15,50,500,5000],cmp:[5,15,50,500,5000],tip:"Eng muhim beshtalik: <b>5, 15, 50, 500, 5000</b>.<br>Endi ularni adashtirmaysiz!"}
];

let S={av:null,xp:0,streak:0,last:"",done:0};
try{const x=JSON.parse(localStorage.getItem("rus5000"));if(x)S=x}catch(e){}
const save=()=>{try{localStorage.setItem("rus5000",JSON.stringify(S))}catch(e){}};

function akey(t){return String(t).replace(/<[^>]*>/g,'').toLowerCase().replace(/[.,!?;:«»"“”…()–—]/g,' ').replace(/\s+/g,' ').trim();}
function unlockClip(){try{AUe=new Audio();AUe.src=SILC;var p=AUe.play();if(p&&p.catch)p.catch(function(){});}catch(e){}}
function playClip(t,done){
  var d=AUDIO[akey(t)];if(!d)return false;
  try{if(!AUe)AUe=new Audio();AUe.onended=done||null;AUe.src=d;var p=AUe.play();if(p&&p.catch)p.catch(function(){});return true;}catch(e){return false;}
}

let voice=null,AC=null,SOUND=false,SID=0;
function pv(){try{voice=speechSynthesis.getVoices().find(x=>/^ru/i.test(x.lang))||null}catch(e){}}
try{pv();speechSynthesis.onvoiceschanged=pv}catch(e){}
// Birinchi bosishda brauzer ovozni ochadi
function unlock(){unlockClip();
 try{const C=window.AudioContext||window.webkitAudioContext;if(C){AC=AC||new C();if(AC.state==="suspended")AC.resume()}}catch(e){}
 try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}catch(e){}
}
function speakList(list,rate){
 if(!SOUND)return;
 const id=++SID;
 if(list.every(t=>AUDIO[akey(t)])){let i=0;const nx=()=>{if(id!==SID||i>=list.length)return;playClip(list[i++],nx)};return nx()}
 if(!voice||!("speechSynthesis" in window))return;
 let started=false;
 const us=list.map((t,k)=>{
  const u=new SpeechSynthesisUtterance(t);
  u.lang="ru-RU";u.voice=voice;u.rate=rate;
  if(k===0){u.onstart=()=>{started=true};}
  return u;
 });
 window._us=us;
 try{speechSynthesis.cancel()}catch(e){}
 setTimeout(()=>{if(id!==SID)return;try{us.forEach(u=>speechSynthesis.speak(u))}catch(e){}},80);
}
function speak(t){speakList([t],.85)}
function seq(l){speakList(l.map(ru),.8)}

function kind(n){if(n>=1000)return"MING";if(n>=100)return"YUZLIK";if(n>=20)return n%10?"o'nlik+birlik":"O'NLIK";if(n>=11)return"11–19";return"BIRLIK"}
const mk=n=>ru(n).replace(/(надцать|десят|сот|тысяч\w*)/,"<mark>$1</mark>");
function cmpHtml(l){return `<div class="tipb"><b>⚖️ Farqini eshiting:</b>${l.map(n=>`<div class="cr" data-n="${n}"><span class="cn">${n}</span><span class="cw">${mk(n)}<small>${uz(n)}</small></span><span class="ck">${kind(n)}</span></div>`).join("")}<button class="btn s" id="sq" style="margin-top:12px">🔊 Hammasini ketma-ket</button></div>`}
const topbar=()=>`<div class="top"><div class="av">${S.av}</div><span>🔥 ${S.streak}</span><span>⭐ ${S.xp}</span></div>`;
function setup(){app(`<h1>🇷🇺 Rus raqamlari</h1><h2 style="font-size:1.1rem">Avatar tanlang</h2><div class="avs">${AV.map(a=>`<button class="avb" data-a="${a}">${a}</button>`).join("")}</div>`);document.querySelectorAll(".avb").forEach(b=>b.onclick=()=>{S.av=b.dataset.a;save();home()})}
function home(){let h=topbar()+`<h2>1 dan 5000 gacha yo'l</h2>`;h+=`<div class="path">`;const off=[0,46,70,46,0,-46,-70];LES.forEach((l,i)=>{const st=i<S.done?"done":i===S.done?"cur":"lock";h+=`<div class="node" style="transform:translateX(${off[i%7]}px)">${st==="cur"?`<div class="bub">${S.av} Boshla!</div>`:""}<button class="nb ${st}" data-i="${i}" ${st==="lock"?"disabled":""}>${st==="done"?"✓":l.ic}</button><div class="nl">${l.t}</div></div>`});app(h+`</div>`);document.querySelectorAll(".nb").forEach(b=>b.onclick=()=>intro(+b.dataset.i))}
let LI=0,Q=null,busy=false;
function intro(i){LI=i;const l=LES[i],sh=l.show||l.n;app(`<div class="qh"><button class="x" id="bk">✕</button><b>${l.t}</b></div><div class="tipb">${S.av} ${l.tip}</div><div class="cards">${sh.map(n=>`<button class="cd" data-n="${n}"><b>${n}</b><span>${ru(n)}</span><small>${uz(n)}</small></button>`).join("")}</div>${l.cmp?cmpHtml(l.cmp):""}<button class="btn" id="st" style="margin-top:14px">Boshlash</button>`);$("#bk").onclick=home;$("#st").onclick=start;document.querySelectorAll(".cd").forEach(c=>c.onclick=()=>speak(ru(+c.dataset.n)));document.querySelectorAll(".cr").forEach(c=>c.onclick=()=>speak(ru(+c.dataset.n)));const sq=$("#sq");if(sq)sq.onclick=()=>seq(l.cmp)}
function distract(n,P,lv){let a=[],b=[];if(lv>=3){a=[n*10,n*100,n+10,(n%10)*10,n-10];b=[n%10,Math.floor(n/10),n+1,n-1]}const ok=x=>Number.isInteger(x)&&x>=0&&x<=5000&&x!==n&&(x>0||P.includes(0));let c=shuf([...new Set(a)].filter(ok)).concat(shuf([...new Set(b)].filter(ok)));c=c.slice(0,3);if(c.length<3)c.push(...shuf(P.filter(x=>x!==n&&!c.includes(x))).slice(0,3-c.length));return c}
function start(){const P=LES[LI].n,sp=shuf(P),ty=["hear","d2w","w2d"],off=Math.floor(Math.random()*3);Q={hearts:5,ok:0,total:10,list:Array.from({length:10},(_,i)=>{const n=sp[i%sp.length];return{n,type:ty[(i+off)%3],opts:shuf([n,...distract(n,P,LI)])}})};qr()}
function qr(){const q=Q.list[0];busy=false;let p,s;if(q.type==="hear"){p=`<button class="spk" id="spk">🔊</button>`;s="Eshiting va raqamni toping"}else if(q.type==="d2w"){p=`<div class="bign">${q.n}</div>`;s="Rus tilida qanday aytiladi?"}else{p=`<div class="bigw">${ru(q.n)}</div><button class="spk s" id="spk">🔊</button>`;s="Bu qaysi raqam?"}
const o=q.opts.map(v=>q.type==="d2w"?`<button class="opt" data-v="${v}"><b>${ru(v)}</b><small>${uz(v)}</small></button>`:`<button class="opt" data-v="${v}"><b class="dg">${v}</b></button>`).join("");
app(`<div class="qh"><button class="x" id="bk">✕</button><div class="pb"><i style="width:${Q.ok/Q.total*100}%"></i></div><b>❤️ ${Q.hearts}</b></div><div class="q"><div class="qs">${s}</div>${p}</div><div class="opts">${o}</div><div class="fb" id="fb"></div>`);
$("#bk").onclick=home;const sp=$("#spk");if(sp)sp.onclick=()=>speak(ru(q.n));if(q.type==="hear")speak(ru(q.n));
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>ans(b))}
function ans(b){if(busy)return;busy=true;const v=+b.dataset.v,q=Q.list[0],right=v===q.n;document.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(+o.dataset.v===q.n)o.classList.add("good")});if(!right)b.classList.add("bad");
$("#fb").className="fb "+(right?"g":"r");$("#fb").innerHTML=`<div class="fbt"><span class="fav ${right?"hop":"shk"}">${S.av}</span><div><b>${right?pick(PR):"Xato, hechqisi yo'q!"}</b><div>${q.n} = ${ru(q.n)} [${uz(q.n)}] · ${kind(q.n)}</div>${right?"":`<div style="margin-top:4px">Siz tanlagan: ${v} = ${ru(v)} · ${kind(v)}</div>`}</div></div><button class="btn" id="go">Davom</button>`;
speak(ru(q.n));if(right){Q.ok++;Q.list.shift();S.xp+=10}else{Q.hearts--;Q.list.push(Q.list.shift())}
$("#go").onclick=()=>{if(Q.hearts<=0)fail();else if(!Q.list.length)fin();else qr()}}
function fail(){app(`<div class="end"><div class="big">💔</div><h2>Yuraklar tugadi</h2><p>Hechqisi yo'q, qayta urinib ko'ring!</p><button class="btn" id="rt">Qayta urinish</button><br><button class="btn s" id="hm">Yo'lga qaytish</button></div>`);$("#rt").onclick=()=>intro(LI);$("#hm").onclick=home}
function fin(){S.xp+=20;S.done=Math.max(S.done,LI+1);const td=new Date().toDateString();if(S.last!==td){const y=new Date(Date.now()-864e5).toDateString();S.streak=S.last===y?S.streak+1:1;S.last=td}save();const last=LI===LES.length-1;
app(`<div class="end"><div class="big"><span class="fav hop">${S.av}</span></div><h2>${last?"🏆 Siz 5000 gacha o'rgandingiz!":"🎉 Dars tugadi!"}</h2><p>⭐ +${Q.total*10+20} ball &nbsp; ❤️ ${Q.hearts}</p><button class="btn" id="hm">Davom</button></div>`);$("#hm").onclick=home}

 app(`<div class="splash"><div class="camel">${CAMEL}</div><button class="btn" id="stt">Boshlash</button></div>`);
 $("#stt").onclick=()=>{
  SOUND=true;
  unlock();
  setTimeout(()=>speak("Привет!"),150);
  S.av?home():setup();
 };
}
splash();
